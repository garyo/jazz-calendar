#:schema node_modules/wrangler/config-schema.json
name = "jazz-calendar"
# The site lives at bostonjazzcalendar.com; workers.dev stays on as a fallback until
# Cloudflare Access guards /admin (see site/README.md). No per-branch preview copies.
workers_dev = true
preview_urls = false
# account_id set via CLOUDFLARE_ACCOUNT_ID env var
compatibility_date = "2026-09-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
# Only these paths invoke the worker; everything else is answered by the
# asset layer directly, which costs no worker CPU or request quota.
run_worker_first = ["/data/*", "/calendar.ics", "/api/*"]

# Scraper output (events.json, status.json), uploaded through
# PUT /api/publish/:key. The bearer token is the PUBLISH_TOKEN secret.
# /calendar.ics is built from events.json (src/worker-calendar.ts).
[[r2_buckets]]
binding = "DATA"
bucket_name = "bostonjazzcalendar-data"

# Gig submissions and their review (src/worker-submissions.ts). Create the
# database once with `bunx wrangler d1 create bostonjazzcalendar`, put the
# printed id below, then apply the schema in migrations/ with
# `bunx wrangler d1 migrations apply bostonjazzcalendar --remote`
# (`--local` for wrangler dev). Secrets: ADMIN_TOKEN and TURNSTILE_SECRET.
[[d1_databases]]
binding = "DB"
database_name = "bostonjazzcalendar"
database_id = "1c1d7094-13dc-449d-b6fb-8bf3667a2206"

# The dead-man's switch: hourly, check that the scraper's events.json is
# fresh and ping ntfy when it isn't (src/worker-freshness.ts).
[triggers]
crons = ["0 * * * *"]

# New gig submissions and stale data ping this ntfy topic. NTFY_TOKEN (base64 "user:password")
# is a secret: `bunx wrangler secret put NTFY_TOKEN`.
[vars]
NTFY_URL = "https://ntfy.oberbrunner.com"
NTFY_TOPIC = "misc"

[observability]
enabled = true
head_sampling_rate = 1
