# Weekly regulars: standing series a venue or the series' organizer publishes, with no dated
# listings. The site shows them in their own section, never as calendar events, because a
# standing schedule doesn't promise any particular night. Only add a series its venue or
# organizer publishes, and recheck it now and then (update `checked`).
#
# when: the schedule as the venue states it

