# Weekly regulars: standing series a venue or the series' organizer publishes, with no dated
# listings. The site shows them in their own section, never as calendar events, because a
# standing schedule doesn't promise any particular night. Only add a series its venue or
# organizer stands behind, and recheck it now and then (update `checked`).
#
# Series sent in through the site's form, once approved on /admin, live in the site's database
# instead; the scraper lists them after these.
#
# when: the schedule as the venue states it, shown to people
# days: the weekdays it runs (mon, tue, wed, thu, fri, sat, sun), so the site can show it on
#   those days
# nth: optional; which of those weekdays in a month, e.g. [1, 3] for 1st and 3rd, -1 for the last

# Wally's lineup is its "week, at a glance" on /ritual/. The house bands rotate, so recheck often.
