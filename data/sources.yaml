# Event sources. Order is priority: when sources list the same event, the earlier one wins,
# so venues' own feeds come before aggregators.
#
# adapter:   ics | tribe | jsonld | localist | spektrix | bibliocommons | squarespace |
#            musicidb | ploughandstars | burren | bentobox | textschedule   (see scraper/src/jazzcal/adapters/)
# venue:     venue id, for single-venue sources
# relevance: jazz | adjacent, to skip classification
# options:   include / exclude — regexes matched against title + source categories;
#            trust_text — let a description mentioning jazz count at any venue;
#            unknown — jazz | adjacent for listings nothing else settles (default: other);
#            title_strip — regex removed from every title (dates, ticket blurbs);
#            plus adapter-specific options

- id: nec
  adapter: ics
  url: https://www.trumba.com/calendars/nec.ics
  venue: nec
  options:
    include: \b(Jazz|Contemporary Musical Arts)\b
    exclude: \b(Master class|Workshop|Prep)\b

- id: longy
  adapter: tribe
  url: https://longy.edu
  venue: longy

- id: tufts
  adapter: ics
  url: https://www.trumba.com/calendars/tts-wms-managed-music.ics
  venue: tufts-granoff

- id: lizard-lounge
  adapter: tribe
  url: https://lizardloungeclub.com
  venue: lizard-lounge

- id: arts-at-the-armory
  adapter: ics
  url: https://artsatthearmory.org/events.ics
  venue: arts-at-the-armory

- id: mad-monkfish
  adapter: bentobox
  url: https://www.themadmonkfish.com/jazz-schedule/
  venue: mad-monkfish
  relevance: jazz
  options:
    title_strip: ^\d{1,2}/\d{1,2}\s+|\s*\(?\b\d{1,2}(:\d{2})?\s*([ap]m)?\s*-\s*\d{1,2}(:\d{2})?\s*[ap]m\)?|\s+\d{1,2}(:\d{2})?\s*[ap]m\b|\s*\(Mad Monkfish Concert Series\)
    ticket_link: a[href*="exploretock.com/themadmonkfish/experience/"]
  notes: Only the www host serves pages; themadmonkfish.com/<path> returns 404.

- id: mit
  adapter: localist
  url: https://calendar.mit.edu
  venue: mit
  options:
    params: {"type[]": [103224]}
    include: \bjazz\b
  notes: Event type 103224 is "Performing Arts". robots.txt disallows ?types URLs on /calendar.

- id: northeastern
  adapter: localist
  url: https://calendar.northeastern.edu
  venue: northeastern
  options:
    params: {"type[]": [12879, 12887, 12888]}
  notes: Event types Concert, Live Performance, Music.

- id: the-cabot
  adapter: spektrix
  url: https://tickets.thecabot.org/thecabot/api/v3
  venue: the-cabot
  options:
    page_url: https://thecabot.org/whats-on/
    title_replace: [["^OC: ", "Off Cabot: "], ["\\s+'\\d\\d\\s*$", ""]]
    exclude: \bSinger-Songwriter\b
  notes: Genre attributes are generous (Blues/Soul on rock acts); "OC:" marks the Off Cabot room.

- id: bpl
  adapter: bibliocommons
  url: https://gateway.bibliocommons.com/v2/libraries/bpl/rss/events
  venue: bpl
  options:
    query: jazz

- id: hobgoblin
  adapter: jsonld
  url: https://www.hobgoblinbar.com/events/
  venue: hobgoblin
  options:
    unknown: jazz
    follow: a[href*="/event/"]
    max_follow: 30
    # JSON-LD gives only the date; the time is in the heading's paragraph.
    time_selector: article h1 + p
    title_strip: ^\d{1,2}/\d{1,2}\s+

- id: beehive
  adapter: jsonld
  url: https://www.beehiveboston.com/musiccalendar
  venue: beehive
  options:
    unknown: adjacent
    follow: a[href*="/event-details/"]
    max_follow: 30
    exclude: \bTBA\b
  notes: Wix detail pages are ~1.5 MB each; cached for 24 h.

- id: berklee-bpc
  adapter: jsonld
  url: https://www.berklee.edu/events/department/BPC
  venue: berklee-performance-center
  options:
    follow: a[href*="/BPC/events/"]
    max_follow: 40
    trust_text: true
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: Berklee's terms require express written consent to use its content on another website. Ask via berklee.edu/contact.

- id: berklee-red-room
  adapter: jsonld
  url: https://www.berklee.edu/red-room-cafe-939/events
  venue: berklee-red-room
  options:
    follow: a[href*="/red-room-cafe-939/events/"]
    max_follow: 20
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: Berklee's terms require express written consent to use its content on another website. Ask via berklee.edu/contact.

- id: vivo
  adapter: jsonld
  url: https://www.vivoperformingarts.org/live-performances/performance-event-calendar/?genre=jazz
  relevance: jazz
  options:
    follow: a[href*="/productions/"]
    max_follow: 30
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: Vivo's terms (2026-01-08) forbid any robot or automatic means to access the site, and allow links only to the home page. Ask info@vivoperformingarts.org.

- id: global-arts-live
  adapter: jsonld
  url: https://www.globalartslive.org/events/list-events
  options:
    follow: a[href^="/content/event_page/"]
    max_follow: 60
    trust_text: true
    # JSON-LD has M-D-Y dates and a blank location; take the time and venue from the page.
    time_selector: .date-display-single
    venue_selector: meta[property="og:title"]
    venue_pattern: \bat ((?:(?! at ).)+)$
    no_price: true  # every event's offer says $20
  notes: All genres (much world music); Crawl-delay 10, so a cold run takes ~10 minutes.

- id: regattabar
  adapter: ticketmaster
  url: https://app.ticketmaster.com/discovery/v2/events.json
  venue: regattabar
  options:
    venue_id: KovZ917AYuX
    unknown: jazz
  notes: >-
    Via the Ticketmaster Discovery API, which carries Regattabar's TicketWeb listings.
    TicketWeb's own pages forbid robots, so never scrape them.

- id: scullers-tm
  adapter: ticketmaster
  url: https://app.ticketmaster.com/discovery/v2/events.json
  venue: scullers
  options:
    venue_id: KovZpZAatEtA
  notes: Via the Ticketmaster Discovery API (Scullers sells through TicketWeb).

- id: lilypad
  adapter: squarespace
  url: https://www.lilypadinman.com/home
  venue: lilypad
  notes: >-
    Squarespace list page (its ?format=json is robots-disallowed). Genre labels come through as
    categories; "Avant-garde" and unlabeled acts don't match the classifier's keywords yet.

- id: scullers
  adapter: musicidb
  url: https://musicidb.com/venue/getVenueEvents.htm?listType=upcoming&frameType=listWidget&descrip=1&venueId=715
  venue: scullers
  options:
    title_strip: \s*[-–]\s*tickets? on sale.*$
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: MusicIDB's terms forbid scraping or crawling without written consent of MusicIDB or its Members (Scullers). Ask Info@ScullersJazz.com and People@MusicIDB.com, or use the Ticketmaster API.

- id: plough-and-stars
  adapter: ploughandstars
  url: https://calendar.ploughandstars.com/events/calendar
  venue: plough-and-stars
  notes: Act names only, no genres; mostly rock/folk, so few events pass the classifier.

- id: the-burren
  adapter: burren
  url: https://www.burren.com/music.html
  venue: the-burren
  notes: Static page; one-line genre blurbs ("Gypsy jazz") feed the classifier.

- id: postunderground
  adapter: textschedule
  url: https://www.postunderground.com/
  venue: postunderground
  relevance: jazz
  notes: >-
    Open Fridays in odd months; the month's sets are posted as plain text on the home page
    a week or two ahead.

# --- Aggregators ---------------------------------------------------------

- id: artsboston
  adapter: ics
  url: https://bostix.org/wp-json/apollo/v1/calendar/subscribe/all
  enabled: false
  notes: >-
    Public ICS of every ArtsBoston/Bostix listing; JazzBoston's calendar is built from the same
    data. Disabled until ArtsBoston agrees to our use of it.
