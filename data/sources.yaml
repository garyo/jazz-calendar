# Event sources. Order is priority: when sources list the same event, the earlier one wins,
# so venues' own feeds come before aggregators.
#
# adapter:   ics | tribe | jsonld | localist | spektrix | bibliocommons | squarespace |
#            musicidb | ploughandstars | burren | bentobox | textschedule | ticketmaster |
#            submissions   (see scraper/src/jazzcal/adapters/)
# venue:     venue id, for single-venue sources
# credit:    how the site credits the source, required when enabled:
#            name — for people ("The Lilypad’s calendar"); url — a public page, never an API
#            or feed; via: true when the source is a third party to the venue (a ticket
#            seller, an aggregator, submissions), so each listing says "via <name>"
# relevance: jazz | adjacent, to skip classification
#
# Classification and titles, for any adapter (regexes match ignoring case):
# include:       a regex; only listings whose title or categories match are kept
# exclude:       a regex; listings whose title or categories match are dropped
# trust_text:    true to let a description mentioning jazz count at any venue
# unknown:       jazz | adjacent for listings nothing else settles (default: other)
# title_strip:   a regex removed from every title (dates, ticket blurbs)
# title_replace: [{pattern: ..., with: ...}, ...] substitutions on every title, after the strip
#
# options:   the adapter's own settings. They're checked when the registry loads, so a
#            misspelled one is an error; `uv run jazzcal adapters` lists each adapter's.

- id: nec
  adapter: ics
  url: https://www.trumba.com/calendars/nec.ics
  credit: {name: "New England Conservatory’s calendar", url: https://necmusic.edu}
  venue: nec
  include: \b(Jazz|Contemporary Musical Arts)\b
  exclude: \b(Master class|Workshop|Prep)\b
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: NEC's site terms say use of its Content on any other website is prohibited. The Trumba feed's own terms allow republishing, but we hold to the stricter reading until NEC agrees. Ask NEC communications or the box office.

- id: longy
  adapter: tribe
  url: https://longy.edu
  credit: {name: "Longy’s calendar", url: https://longy.edu/calendar/}
  venue: longy
  title_strip: ^(MAIN|STUDIO|BACK) STAGE\s*[|:]\s*

- id: tufts
  adapter: ics
  url: https://www.trumba.com/calendars/tts-wms-managed-music.ics
  credit: {name: "Tufts Music’s calendar", url: https://as.tufts.edu/music/news-events/events/calendar}
  venue: tufts-granoff
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: Tufts' site terms forbid copying or republishing material from its services. The Trumba feed's own terms allow republishing, but we hold to the stricter reading until Tufts agrees. Ask musicadmin@tufts.edu.

- id: sanders-theatre
  adapter: ics
  url: https://www.trumba.com/calendars/gazette.ics?search=Sanders%20Theatre&months=6
  credit: {name: "Harvard Gazette’s events calendar", url: https://news.harvard.edu/gazette/harvard-events/events-calendar/}
  venue: sanders-theatre
  notes: >-
    The Gazette's Trumba feed, searched for the hall; unfiltered it stops at 500 events, about
    a month ahead. Harvard's own arts and box office sites are behind Akamai, but the Gazette
    and Trumba set no terms against reuse (checked 2026-10-15). Mostly classical; jazz is rare.

- id: harvard-jazz
  adapter: ics
  url: https://www.trumba.com/calendars/gazette.ics?search=jazz&months=6
  credit: {name: "Harvard Gazette’s events calendar", url: https://news.harvard.edu/gazette/harvard-events/events-calendar/}
  trust_text: true
  notes: >-
    The same feed searched for "jazz", which also matches descriptions, for shows elsewhere
    at Harvard (e.g. ArtsThursdays at Paine Hall). The Jazz Bands aren't listed here.

- id: lizard-lounge
  adapter: tribe
  url: https://lizardloungeclub.com
  credit: {name: "Lizard Lounge’s calendar", url: https://lizardloungeclub.com/calendar}
  venue: lizard-lounge

- id: arts-at-the-armory
  adapter: ics
  url: https://artsatthearmory.org/events.ics
  credit: {name: "Arts at the Armory’s calendar", url: https://artsatthearmory.org/events-calendar/}
  venue: arts-at-the-armory

- id: mad-monkfish
  adapter: bentobox
  url: https://www.themadmonkfish.com/jazz-schedule/
  credit: {name: "The Mad Monkfish’s jazz schedule", url: https://www.themadmonkfish.com/jazz-schedule/}
  venue: mad-monkfish
  relevance: jazz
  title_strip: ^\d{1,2}/\d{1,2}\s+|\s*\(?\b\d{1,2}(:\d{2})?\s*([ap]m)?\s*-\s*\d{1,2}(:\d{2})?\s*[ap]m\)?|\s+\d{1,2}(:\d{2})?\s*[ap]m\b|\s*\(Mad Monkfish Concert Series\)
  options:
    ticket_link: a[href*="exploretock.com/themadmonkfish/experience/"]
  notes: Only the www host serves pages; themadmonkfish.com/<path> returns 404.

- id: mit
  adapter: localist
  url: https://calendar.mit.edu
  credit: {name: "MIT Events Calendar", url: https://calendar.mit.edu}
  venue: mit
  include: \bjazz\b
  options:
    params: {"type[]": [103224]}
  notes: Event type 103224 is "Performing Arts". robots.txt disallows ?types URLs on /calendar.

- id: northeastern
  adapter: localist
  url: https://calendar.northeastern.edu
  credit: {name: "Northeastern University’s calendar", url: https://calendar.northeastern.edu}
  venue: northeastern
  options:
    params: {"type[]": [12879, 12887, 12888]}
  notes: Event types Concert, Live Performance, Music.

- id: the-cabot
  adapter: spektrix
  url: https://tickets.thecabot.org/thecabot/api/v3
  credit: {name: "The Cabot’s calendar", url: https://thecabot.org/whats-on/}
  venue: the-cabot
  exclude: \bSinger-Songwriter\b
  title_strip: \s+'\d\d\s*$
  title_replace: [{pattern: "^OC: ", with: "Off Cabot: "}]
  options:
    page_url: https://thecabot.org/whats-on/
  notes: Genre attributes are generous (Blues/Soul on rock acts); "OC:" marks the Off Cabot room.

- id: bpl
  adapter: bibliocommons
  url: https://gateway.bibliocommons.com/v2/libraries/bpl/rss/events
  credit: {name: "Boston Public Library events", url: https://bpl.bibliocommons.com/events}
  venue: bpl
  options:
    query: jazz

- id: hobgoblin
  adapter: jsonld
  url: https://www.hobgoblinbar.com/events/
  credit: {name: "HobGoblin’s calendar", url: https://www.hobgoblinbar.com/events/}
  venue: hobgoblin
  unknown: jazz
  title_strip: ^\d{1,2}/\d{1,2}\s+
  options:
    follow: a[href*="/event/"]
    max_follow: 30
    # JSON-LD gives only the date; the time is in the heading's paragraph.
    time_selector: article h1 + p

- id: beehive
  adapter: jsonld
  url: https://www.beehiveboston.com/musiccalendar
  credit: {name: "The Beehive’s music calendar", url: https://www.beehiveboston.com/musiccalendar}
  venue: beehive
  unknown: adjacent
  exclude: \bTBA\b
  options:
    follow: a[href*="/event-details/"]
    max_follow: 30
  notes: Wix detail pages are ~1.5 MB each; cached for 5 days.

- id: ica-boston
  adapter: jsonld
  url: https://www.icaboston.org/calendar/?event_type%5B%5D=music
  credit: {name: "ICA Boston’s calendar", url: https://www.icaboston.org/calendar/}
  venue: ica-boston
  trust_text: true
  options:
    follow: h3.teaser-title a[href*="/events/"]
    max_follow: 20
  notes: >-
    The calendar filtered to Music; event pages carry full JSON-LD. A few shows a year, mostly
    not jazz. The site has no terms of use (checked 2026-10-15); tickets are on my.icaboston.org.

- id: berklee-bpc
  adapter: jsonld
  url: https://www.berklee.edu/events/department/BPC
  credit: {name: "Berklee Performance Center’s calendar", url: https://www.berklee.edu/events/department/BPC}
  venue: berklee-performance-center
  trust_text: true
  options:
    follow: a[href*="/BPC/events/"]
    max_follow: 40
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: Berklee's terms require express written consent to use its content on another website. Ask via berklee.edu/contact.

- id: berklee-red-room
  adapter: jsonld
  url: https://www.berklee.edu/red-room-cafe-939/events
  credit: {name: "Red Room @ Café 939’s calendar", url: https://www.berklee.edu/red-room-cafe-939/events}
  venue: berklee-red-room
  options:
    follow: a[href*="/red-room-cafe-939/events/"]
    max_follow: 20
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: Berklee's terms require express written consent to use its content on another website. Ask via berklee.edu/contact.

- id: vivo
  adapter: jsonld
  url: https://www.vivoperformingarts.org/live-performances/performance-event-calendar/?genre=jazz
  credit: {name: "Vivo Performing Arts", url: https://www.vivoperformingarts.org}
  relevance: jazz
  options:
    follow: a[href*="/productions/"]
    max_follow: 30
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: Vivo's terms (2026-01-08) forbid any robot or automatic means to access the site, and allow links only to the home page. Ask info@vivoperformingarts.org.

- id: global-arts-live
  adapter: jsonld
  url: https://www.globalartslive.org/events/list-events
  credit: {name: "Global Arts Live", url: https://www.globalartslive.org/events/list-events}
  trust_text: true
  options:
    follow: a[href^="/content/event_page/"]
    max_follow: 60
    # JSON-LD has M-D-Y dates and a blank location; take the time and venue from the page.
    time_selector: .date-display-single
    venue_selector: meta[property="og:title"]
    venue_pattern: \bat ((?:(?! at ).)+)$
    no_price: true  # every event's offer says $20
  notes: All genres (much world music); Crawl-delay 10, so a cold run takes ~10 minutes.

- id: regattabar
  adapter: ticketmaster
  url: https://app.ticketmaster.com/discovery/v2/events.json
  credit: {name: "Ticketmaster", url: https://www.ticketmaster.com, via: true}
  venue: regattabar
  unknown: jazz
  options:
    venue_id: KovZ917AYuX
  notes: >-
    Via the Ticketmaster Discovery API, which carries Regattabar's TicketWeb listings.
    TicketWeb's own pages forbid robots, so never scrape them.

- id: scullers-tm
  adapter: ticketmaster
  url: https://app.ticketmaster.com/discovery/v2/events.json
  credit: {name: "Ticketmaster", url: https://www.ticketmaster.com, via: true}
  venue: scullers
  options:
    venue_id: KovZpZAatEtA
  notes: Via the Ticketmaster Discovery API (Scullers sells through TicketWeb).

- id: lilypad
  adapter: squarespace
  url: https://www.lilypadinman.com/home
  credit: {name: "The Lilypad’s calendar", url: https://www.lilypadinman.com/home}
  venue: lilypad
  notes: >-
    Squarespace list page (its ?format=json is robots-disallowed). Genre labels come through as
    categories; "Avant-garde" and unlabeled acts don't match the classifier's keywords yet.

- id: scullers
  adapter: musicidb
  url: https://musicidb.com/venue/getVenueEvents.htm?listType=upcoming&frameType=listWidget&descrip=1&venueId=715
  credit: {name: "Scullers’ calendar", url: https://www.scullersjazz.com}
  venue: scullers
  title_strip: \s*[-–]\s*tickets? on sale.*$
  enabled: false
  notes: >-
    Disabled 2026-10-15 for terms of use: MusicIDB's terms forbid scraping or crawling without written consent of MusicIDB or its Members (Scullers). Ask Info@ScullersJazz.com and People@MusicIDB.com, or use the Ticketmaster API.

- id: plough-and-stars
  adapter: ploughandstars
  url: https://calendar.ploughandstars.com/events/calendar
  credit: {name: "The Plough & Stars’ calendar", url: https://calendar.ploughandstars.com/events/calendar}
  venue: plough-and-stars
  notes: Act names only, no genres; mostly rock/folk, so few events pass the classifier.

- id: the-burren
  adapter: burren
  url: https://www.burren.com/music.html
  credit: {name: "The Burren’s music listings", url: https://www.burren.com/music.html}
  venue: the-burren
  notes: Static page; one-line genre blurbs ("Gypsy jazz") feed the classifier.

- id: postunderground
  adapter: textschedule
  url: https://www.postunderground.com/
  credit: {name: "POSTunderground", url: https://www.postunderground.com/}
  venue: postunderground
  relevance: jazz
  notes: >-
    Open Fridays in odd months; the month's sets are posted as plain text on the home page
    a week or two ahead.

# --- Submitted gigs ------------------------------------------------------
# Below the venues' own sources, so a venue's listing of the same show wins.

- id: submissions
  adapter: submissions
  url: https://bostonjazzcalendar.com/api/submissions/approved
  credit: {name: "gig submission", url: https://bostonjazzcalendar.com/#submit, via: true}
  notes: >-
    Gigs sent in through the site's form and approved on /admin. The adapter reads them from
    $JAZZCAL_SITE (default bostonjazzcalendar.com) with JAZZCAL_PUBLISH_TOKEN; each carries
    the editor's venue and relevance.

# --- Aggregators ---------------------------------------------------------

- id: artsboston
  adapter: ics
  url: https://bostix.org/wp-json/apollo/v1/calendar/subscribe/all
  credit: {name: "ArtsBoston Calendar / JazzBoston", url: https://bostix.org, via: true}
  enabled: false
  notes: >-
    Public ICS of every ArtsBoston/Bostix listing; JazzBoston's calendar is built from the same
    data. Disabled until ArtsBoston agrees to our use of it.
